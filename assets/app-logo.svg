<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2c5e"/><stop offset="1" stop-color="#0c1230"/></linearGradient>
    <linearGradient id="steelTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f8fb"/><stop offset="1" stop-color="#c9d2dc"/></linearGradient>
    <linearGradient id="steelSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aeb9c5"/><stop offset="1" stop-color="#6f7b89"/></linearGradient>
    <linearGradient id="flange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e9ef"/><stop offset="1" stop-color="#95a1ae"/></linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a3560"/><stop offset="1" stop-color="#0a0e1f"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#c93cd6"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d5ce7"/><stop offset="1" stop-color="#c93cd6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.9"/>
  <!-- digital-twin node network -->
  <g stroke="#8b94d6" stroke-width="2.5" opacity="0.4" fill="none"><path d="M70 420 L150 372 L240 430 L330 392 L440 420 M150 372 L120 300 M330 392 L360 320"/></g>
  <g fill="#c084fc" filter="url(#glow)"><circle cx="70" cy="420" r="7"/><circle cx="150" cy="372" r="7"/><circle cx="240" cy="430" r="7"/><circle cx="330" cy="392" r="7"/><circle cx="440" cy="420" r="7"/></g>
  <!-- isometric rectangular duct, open end facing front-right -->
  <g filter="url(#shadow)">
    <polygon points="126,178 262,110 340,148 204,216" fill="url(#steelTop)"/>
    <polygon points="126,178 204,216 204,352 126,314" fill="url(#steelSide)"/>
    <polygon points="204,216 340,148 340,284 204,352" fill="url(#flange)"/>
    <polygon points="220,222 326,169 326,272 220,325" fill="url(#inner)"/>
    <polygon points="234,229 314,189 314,262 234,302" fill="#070a17"/>
    <!-- seams / TDF flange lines -->
    <path d="M150,190 L150,326 M178,204 L178,340" stroke="#5c6876" stroke-width="3" opacity="0.65"/>
    <path d="M126,178 L204,216 L340,148" stroke="#ffffff" stroke-width="2" opacity="0.5" fill="none"/>
  </g>
  <!-- airflow ribbons -->
  <g fill="none" stroke="url(#flow)" stroke-linecap="round" filter="url(#glow)">
    <path d="M280 236 C 340 226, 380 236, 432 222" stroke-width="15" opacity="0.95"/>
    <path d="M282 262 C 340 270, 380 296, 426 290" stroke-width="12" opacity="0.85"/>
    <path d="M278 210 C 330 190, 372 186, 420 170" stroke-width="9" opacity="0.7"/>
  </g>
  <polygon points="428,206 462,222 428,240" fill="#c93cd6" filter="url(#glow)"/>
</svg>
