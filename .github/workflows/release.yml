name: Build Windows installer & publish release

# Triggered by pushing a version tag (v1.2.3) — builds the NSIS installer on Windows and publishes it
# (plus latest.yml + .blockmap used by the in-app auto-updater) to GitHub Releases.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the build to GitHub Releases'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle renderer
        run: npm run build:renderer

      - name: Unit tests
        run: node --test "test/**/*.test.js"

      - name: Check that the tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "package.json version ($PKG) does not match tag ($TAG)"; exit 1; fi

      - name: Prepare the releases repository (create it or its first commit if needed)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: node scripts/prepare-release-repo.mjs
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}

      - name: Build installer and publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: npx electron-builder --win nsis --publish always
        env:
          # RELEASES_TOKEN (optional PAT) lets you publish to a separate public "releases" repository;
          # otherwise the workflow token publishes to this repository.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          # Upload into a release that was created from the GitHub web UI even if it was published a while ago.
          EP_GH_IGNORE_TIME: "true"
          # Optional Windows code-signing certificate (base64 .pfx) — removes the SmartScreen warning.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build installer only (no publish)
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
        run: npx electron-builder --win nsis --publish never

      # Keeps a copy of the installer as a workflow artifact for manual (non-publishing) builds only.
      # Publishing runs already have their files on the GitHub Release, and Actions artifact storage
      # is quota-limited on private repositories, so this step must never fail a release build.
      - uses: actions/upload-artifact@v4
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
        continue-on-error: true
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
